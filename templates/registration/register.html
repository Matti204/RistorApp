{% extends "base.html" %}
{% block title %}Registrati{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
  <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
    <h1 class="h3 fw-bold mb-2">Crea il tuo account</h1><p class="text-body-secondary mb-4">Inserisci i tuoi dati per iniziare.</p>
    <form method="post">{% csrf_token %}{% include "registration/_fields.html" %}<button class="btn btn-success w-100 mt-2" type="submit">Registrati</button></form>
    <p class="text-center text-body-secondary mt-4 mb-0">Hai gi&#224; un account? <a class="link-success" href="{% url 'login' %}">Accedi</a></p>
  </div></div>
</div></div>
{% endblock %}
