{% extends "base.html" %}
{% block title %}Accedi{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
  <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
    <h1 class="h3 fw-bold mb-2">Bentornato</h1><p class="text-body-secondary mb-4">Accedi al tuo account.</p>
    <form method="post">{% csrf_token %}{% include "registration/_fields.html" %}<button class="btn btn-success w-100 mt-2" type="submit">Accedi</button></form>
    <p class="text-center text-body-secondary mt-4 mb-0">Non hai un account? <a class="link-success" href="{% url 'register' %}">Registrati</a></p>
  </div></div>
</div></div>
{% endblock %}
