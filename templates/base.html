<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RistorApp{% endblock %} | RistorApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">
  <nav class="navbar bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-bold text-success-emphasis" href="{% url 'home' %}">RistorApp</a>
      {% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-success btn-sm" type="submit">Esci</button></form>{% endif %}
    </div>
  </nav>
  <main class="container flex-grow-1 py-5">{% block content %}{% endblock %}</main>
</body>
</html>
