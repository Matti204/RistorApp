{% load static %}
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RistorApp{% endblock %} | RistorApp</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">
  <nav class="navbar bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-bold text-success-emphasis" href="{% url 'home' %}">RistorApp</a>
      {% if user.is_authenticated %}<a class="nav-link link-success me-auto ms-3" href="{% url 'dishes' %}">Piatti</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-success btn-sm" type="submit">Esci</button></form>{% endif %}
    </div>
  </nav>
  <main class="container flex-grow-1 py-5">{% block content %}{% endblock %}</main>
<script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
